<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online AI Database Bot Server</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        h2 { text-align: center; color: #4CAF50; margin-top: 0; font-size: 18px; }
        .petunjuk {
            background: #2d2d2d;
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
            color: #e0e0e0;
            margin-bottom: 20px;
            line-height: 1.6;
            border-left: 4px solid #4CAF50;
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #252525;
            color: #fff;
            font-size: 15px;
            box-sizing: border-box;
        }
        input[type="text"]:focus { border-color: #4CAF50; outline: none; }
        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background-color: #45a049; }
        .hasil-box {
            margin-top: 20px;
            padding: 15px;
            background: #252525;
            border-radius: 8px;
            border: 1px solid #333;
            min-height: 50px;
        }
        .status-sukses { color: #4CAF50; font-weight: bold; margin: 0; }
        .status-bot { color: #2196F3; font-weight: bold; margin: 0; }
        .status-baru { color: #FF9800; font-weight: bold; margin: 0; }
    </style>
</head>
<body>
    <div class="container">
        <h2>=== ONLINE AI DATABASE BOT SERVER IS READY ===</h2>
        
        <div class="petunjuk">
            Please use <code>/answer ai [something we just indexed] in [sentence we want]</code><br><br>
            <strong>Example:</strong> <code>/answer ai hello in hello too my friend</code>
        </div>

        <div class="form-group">
            <label for="pesan">Enter Message / Command:</label>
            <input type="text" id="pesan" placeholder="Type your message here..." autocomplete="off">
        </div>
        <button onclick="prosesServer()">Send to Server</button>

        <div class="hasil-box" id="hasilBox" style="display: none;">
            <label>Server Response:</label>
            <p id="responTeks"></p>
        </div>
    </div>

    <script>
        // KODE SAKTI: Langsung menghapus total database lama begitu halaman dibuka pertama kali
        localStorage.setItem('memori_bot', JSON.stringify({}));

        function prosesServer() {
            const inputElement = document.getElementById('pesan');
            const pesanUser = inputElement.value.trim();
            const hasilBox = document.getElementById('hasilBox');
            const responTeks = document.getElementById('responTeks');

            if (!pesanUser) return;

            let database = JSON.parse(localStorage.getItem('memori_bot'));
            hasilBox.style.display = "block";

            // --- JALUR 1: DETEKSI PERINTAH /answer ai ---
            if (pesanUser.startsWith('/answer ai ')) {
                let teksPerintah = pesanUser.substring(11).trim();
                
                if (teksPerintah.includes(' in ')) {
                    let bagian = teksPerintah.split(' in ');
                    let tanya = bagian[0].trim().toLowerCase();
                    let jawab = bagian.slice(1).join(' in ').trim(); 
                    
                    database[tanya] = jawab;
                    localStorage.setItem('memori_bot', JSON.stringify(database));
                    
                    responTeks.innerText = `✓ sentence '${pesanUser}' successfully indexed!`;
                    responTeks.className = "status-sukses";
                } else {
                    responTeks.innerText = "⚠ Wrong format! Use: /answer ai [question] in [answer]";
                    responTeks.className = "status-baru";
                }

            // --- JALUR 2: CHAT ATAU KATA KUNCI BIASA ---
            } else {
                let kataKunci = pesanUser.toLowerCase();
                
                if (database[kataKunci]) {
                    responTeks.innerText = `🤖 [AI]: ${database[kataKunci]}`;
                    responTeks.className = "status-bot";
                } else {
                    let jumlahKata = pesanUser.split(/\s+/).length;
                    let tipe = (jumlahKata === 1) ? "word" : "sentence";
                    
                    database[kataKunci] = pesanUser;
                    localStorage.setItem('memori_bot', JSON.stringify(database));
                    
                    responTeks.innerText = `✓ ${tipe} '${pesanUser}' successfully indexed!`;
                    responTeks.className = "status-baru";
                }
            }
            
            inputElement.value = "";
        }

        document.getElementById('pesan').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                prosesServer();
            }
        });
    </script>
</body>
</html>
