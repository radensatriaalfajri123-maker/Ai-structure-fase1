<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global AI Database Server</title>
    <!-- Memuat Library Firebase JS SDK v9+ (Compat Mode) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        h2 { text-align: center; color: #4CAF50; margin-top: 0; font-size: 18px; }
        .petunjuk {
            background: #2d2d2d;
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
            color: #e0e0e0;
            margin-bottom: 20px;
            line-height: 1.6;
            border-left: 4px solid #4CAF50;
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #252525;
            color: #fff;
            font-size: 15px;
            box-sizing: border-box;
        }
        input[type="text"]:focus { border-color: #4CAF50; outline: none; }
        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background-color: #45a049; }
        .hasil-box {
            margin-top: 20px;
            padding: 15px;
            background: #252525;
            border-radius: 8px;
            border: 1px solid #333;
            min-height: 50px;
        }
        .status-sukses { color: #4CAF50; font-weight: bold; margin: 0; }
        .status-bot { color: #2196F3; font-weight: bold; margin: 0; }
        .status-baru { color: #FF9800; font-weight: bold; margin: 0; }
    </style>
</head>
<body>
    <div class="container">
        <h2>=== GLOBAL AI DATABASE SERVER IS READY ===</h2>
        
        <div class="petunjuk">
            Please use <code>/answer ai [something we just indexed] in [sentence we want]</code><br><br>
            <strong>Example:</strong> <code>/answer ai hello in hello too my friend</code>
        </div>

        <div class="form-group">
            <label for="pesan">Enter Message / Command:</label>
            <input type="text" id="pesan" placeholder="Type your message here..." autocomplete="off">
        </div>
        <button onclick="prosesServer()">Send to Server</button>

        <div class="hasil-box" id="hasilBox" style="display: none;">
            <label>Server Response:</label>
            <p id="responTeks">Connecting to database...</p>
        </div>
    </div>

    <script>
        // Konfigurasi Firebase Lengkap
        const firebaseConfig = {
            apiKey: "AIzaSyA7A_WUnqgyJsmG-FH6Oo3a4w2p4rOn__s",
            authDomain: "ai-project-fase1.firebaseapp.com",
            databaseURL: "https://ai-project-fase1-default-rtdb.firebaseio.com",
            projectId: "ai-project-fase1",
            storageBucket: "ai-project-fase1.firebasestorage.app",
            messagingSenderId: "842443540765",
            appId: "1:842443540765:web:3d0c746d99af",
            measurementId: "G-4MEP3EFDXY"
        };

        // Inisialisasi Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Helper sanitasi Key terlarang
        function cleanKey(text) {
            return text.replace(/[.#$\[\]\/]/g, "_");
        }

        async function prosesServer() {
            const inputElement = document.getElementById('pesan');
            const pesanUser = inputElement.value.trim();
            const hasilBox = document.getElementById('hasilBox');
            const responTeks = document.getElementById('responTeks');

            if (!pesanUser) return;

            hasilBox.style.display = "block";
            responTeks.innerText = "Processing...";
            responTeks.className = "";

            // --- JALUR 1: PERINTAH DAFTAR (/answer ai) ---
            if (pesanUser.startsWith('/answer ai ')) {
                let teksPerintah = pesanUser.substring(11).trim();
                
                if (teksPerintah.includes(' in ')) {
                    let bagian = teksPerintah.split(' in ');
                    let tanya = cleanKey(bagian[0].trim().toLowerCase());
                    let jawab = bagian.slice(1).join(' in ').trim(); 
                    
                    try {
                        await database.ref('memori_bot/' + tanya).set({
                            pertanyaan: tanya,
                            jawaban: jawab
                        });

                        responTeks.innerText = `✓ sentence '${pesanUser}' successfully indexed to cloud database!`;
                        responTeks.className = "status-sukses";
                    } catch (error) {
                        responTeks.innerText = `❌ Error: ${error.message}`;
                    }
                } else {
                    responTeks.innerText = "⚠ Wrong format! Use: /answer ai [question] in [answer]";
                    responTeks.className = "status-baru";
                }

            // --- JALUR 2: OBROLAN / KATA KUNCI BIASA ---
            } else {
                let kataKunci = cleanKey(pesanUser.toLowerCase());
                
                try {
                    const snapshot = await database.ref('memori_bot/' + kataKunci).once('value');
                    
                    if (snapshot.exists()) {
                        const data = snapshot.val();
                        responTeks.innerText = `🤖 [AI]: ${data.jawaban}`;
                        responTeks.className = "status-bot";
                    } else {
                        let jumlahKata = pesanUser.split(/\s+/).length;
                        let tipe = (jumlahKata === 1) ? "word" : "sentence";
                        
                        await database.ref('memori_bot/' + kataKunci).set({
                            pertanyaan: kataKunci,
                            jawaban: pesanUser
                        });
                        
                        responTeks.innerText = `✓ ${tipe} '${pesanUser}' successfully indexed globally!`;
                        responTeks.className = "status-baru";
                    }
                } catch (error) {
                    responTeks.innerText = `❌ Error: ${error.message}`;
                }
            }
            inputElement.value = "";
        }

        document.getElementById('pesan').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                prosesServer();
            }
        });
    </script>
</body>
</html>
